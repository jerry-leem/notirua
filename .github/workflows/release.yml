name: Release build

# Installers for the three systems (M6): Windows (.exe), macOS Apple Silicon (.dmg),
# and Linux x86_64 (.AppImage). Each job builds, checks the bundle, and tries the result;
# `publish` attaches whatever was built to the release (README "릴리스를 만드는 방법").
# A pull request that changes the packaging runs the same builds, so a change cannot break
# a release unnoticed; it never publishes.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installer to this existing release (for example v0.4.1); empty = build only"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The version is written once, in pyproject.toml. A tag or release_tag that
      # names another version stops here, before the long build.
      - name: Tag matches the version in pyproject.toml
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: uv run --no-project --python 3.11 python packaging/versioning.py --tag "$env:RELEASE_TAG"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            make diffutils tar xz
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/lgpl-av/ffmpeg
          key: lgpl-ffmpeg-win64-${{ hashFiles('packaging/build_lgpl_av.py', '.github/workflows/release.yml') }}
      # GCC (UCRT, like MSVC) rather than MSVC: with only the needed parts
      # enabled, MSVC crashes on libavformat/cbs.c (C1001). FFmpeg's mingw build
      # also writes MSVC import libraries (.lib) for PyAV, which builds with MSVC.
      - name: Build LAME and LGPL-only FFmpeg with MinGW GCC
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          PREFIX="$ROOT/build/lgpl-av/ffmpeg"
          LAME="$ROOT/build/lgpl-av/lame"
          VERSION=$(uv run --no-project --python 3.11 python -c "import sys; sys.path.insert(0, 'packaging'); import build_lgpl_av as b; print(b.FFMPEG_VERSION, b.FFMPEG_SHA256, b.FFMPEG_URL, b.LAME_VERSION, b.LAME_SHA256, b.LAME_URL)")
          read -r FF_VERSION FF_SHA FF_URL LAME_VERSION LAME_SHA LAME_URL <<< "$VERSION"
          # GCC is a Windows program: give it LAME's folder as C:/... rather than /d/....
          FLAGS=$(uv run --no-project --python 3.11 python packaging/build_lgpl_av.py --print-configure-flags "$PREFIX" --lame-prefix "$(cygpath -m "$LAME")")
          mkdir -p build/lgpl-av && cd build/lgpl-av
          # LAME (LGPL) as a static library, linked into avcodec for MP3 saving.
          curl -fsSLo lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA  lame.tar.gz" | sha256sum -c -
          tar xf lame.tar.gz
          (cd "lame-$LAME_VERSION" && ./configure --prefix="$LAME" --disable-shared \
              --enable-static --disable-frontend --disable-gtktest --disable-decoder \
            && make -j"$(nproc)" && make install)
          ls "$LAME/lib"
          curl -fsSLo ffmpeg.tar.xz "$FF_URL"
          echo "$FF_SHA  ffmpeg.tar.xz" | sha256sum -c -
          tar xf ffmpeg.tar.xz
          cd "ffmpeg-$FF_VERSION"
          # Link GCC's runtime (libgcc, winpthreads) into the DLLs: otherwise
          # delvewheel may bundle Git for Windows' msvcrt copies found on PATH,
          # and importing av fails with "The specified procedure could not be found".
          ./configure $FLAGS --extra-ldflags=-static
          make -j"$(nproc)"
          make install
          # The import libraries are installed next to the DLLs.
          cp -n "$PREFIX"/bin/*.lib "$PREFIX/lib/" || true
          ls "$PREFIX/bin" "$PREFIX/lib"
          # Each DLL may only need Windows' own DLLs and the other FFmpeg DLLs.
          for dll in "$PREFIX"/bin/*.dll; do
            echo "$(basename "$dll"): $(objdump -p "$dll" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')"
          done
      - name: Install
        run: uv sync --locked
      - name: LGPL PyAV wheel
        run: uv run python packaging/build_lgpl_av.py --ffmpeg-prefix build/lgpl-av/ffmpeg
      - name: Show the wheel's DLL dependencies (on failure)
        if: failure()
        shell: pwsh
        run: |
          $libs = "build\lgpl-av\test-venv\Lib\site-packages\av.libs"
          Get-ChildItem $libs
          Get-ChildItem $libs\*.dll, build\lgpl-av\test-venv\Lib\site-packages\av\_core*.pyd |
            ForEach-Object { dumpbin /nologo /dependents $_.FullName }
      - name: Bundle and check
        run: uv run python packaging/build_app.py
      - name: Installer
        shell: pwsh
        run: |
          $version = (uv run --no-project --python 3.11 python packaging/versioning.py).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$pwd\dist\app\Notirua" `
            "/DOutputDir=$pwd\dist" `
            "/DIconFile=$pwd\build\icons-win32\notirua.ico" `
            packaging\windows\notirua.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe
      # Install like a user (per user, silent) and try it: components, sheet
      # music, MP3/M4A mixes, and the window (packaging/smoke_test.py).
      - name: Try the installed app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Notirua-*-setup.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $dir = "$env:LOCALAPPDATA\Programs\Notirua"
          uv run python packaging/smoke_test.py --cli "$dir\notirua-cli.exe" --gui "$dir\Notirua.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: notirua-windows
          path: |
            dist/*.exe
            dist/lgpl-av/*.whl

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tag matches the version in pyproject.toml
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: uv run --no-project --python 3.11 python packaging/versioning.py --tag "$RELEASE_TAG"
      # The LGPL FFmpeg wheel takes the longest; packaging/linux/build.sh skips it when the
      # wheel is already in dist/lgpl-av.
      - name: LGPL FFmpeg cache
        uses: actions/cache@v4
        with:
          path: dist/lgpl-av
          key: lgpl-av-linux-${{ hashFiles('packaging/build_lgpl_av.py', 'packaging/linux/Dockerfile') }}
      - name: Install
        run: uv sync --locked
      # Ubuntu 20.04 image (glibc 2.31): FFmpeg wheel, bundle, bundle check, AppImage.
      - name: Bundle, check, and AppImage
        run: packaging/linux/build.sh
      # Run it like a user (FUSE is not needed): components, sheet music, MP3/M4A mixes, window.
      - name: Try the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMAGE="$(ls "$PWD"/dist/Notirua-*-linux-x86_64.AppImage | head -1)"
          # Not build/: the Docker build made that folder as root.
          uv run python packaging/smoke_test.py --cli "$APPIMAGE" --gui "$APPIMAGE" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: notirua-linux
          path: |
            dist/*.AppImage
            dist/lgpl-av/*.whl

  macos:
    # macOS 15 or newer: the LilyPond build the app downloads needs a newer system than 14
    # to start (its "Try the app" step). The app itself is built for macOS 14 and later
    # (MACOSX_DEPLOYMENT_TARGET in build_lgpl_av.py).
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tag matches the version in pyproject.toml
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: uv run --no-project --python 3.11 python packaging/versioning.py --tag "$RELEASE_TAG"
      - name: LGPL FFmpeg cache
        id: av-cache
        uses: actions/cache@v4
        with:
          path: dist/lgpl-av
          key: lgpl-av-macos-arm64-${{ hashFiles('packaging/build_lgpl_av.py') }}
      - name: pkg-config
        run: command -v pkg-config >/dev/null || brew install pkgconf
      - name: Install
        run: uv sync --locked
      - name: LGPL FFmpeg and PyAV wheel
        if: steps.av-cache.outputs.cache-hit != 'true'
        run: uv run python packaging/build_lgpl_av.py
      - name: Bundle and check
        run: uv run python packaging/build_app.py
      # Not signed or notarized (no secrets here): the disk image is for people who accept
      # the first-start warning described in the release notes.
      - name: Disk image
        run: uv run python packaging/make_dmg.py
      - name: Try the app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="$PWD/dist/app/Notirua.app/Contents/MacOS"
          uv run python packaging/smoke_test.py --cli "$APP/notirua-cli" --gui "$APP/Notirua"
      - uses: actions/upload-artifact@v4
        with:
          name: notirua-macos
          path: |
            dist/*.dmg
            dist/lgpl-av/*.whl

  # The installer goes from the build job to the release inside GitHub, so nobody
  # has to download and re-upload it. Needs the release to exist (a draft is fine).
  publish:
    needs: [windows, linux, macos]
    # Runs even when one system failed, so the others are not held back; the warning lists it.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true  # a system that failed has no artifact
        with:
          pattern: notirua-*
          merge-multiple: true
          path: dist
      - name: Attach the installers to the release
        env:
          RESULTS: "Windows=${{ needs.windows.result }} Linux=${{ needs.linux.result }} macOS=${{ needs.macos.result }}"
        run: |
          for r in $RESULTS; do
            case "$r" in *=success) ;; *) echo "::warning::Not attached, build did not succeed: $r" ;; esac
          done
          shopt -s nullglob
          files=(dist/Notirua-*-setup.exe dist/Notirua-*.dmg dist/Notirua-*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer was built, nothing to attach"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::No release named $TAG yet; create it, then run this workflow again with release_tag=$TAG"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
