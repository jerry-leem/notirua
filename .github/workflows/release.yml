name: Release build

# Windows installer (M6). macOS and Linux are built locally for now
# (packaging/build_app.py, packaging/linux/build.sh); README "릴리스를 만드는 방법".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            make diffutils tar xz
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: build/lgpl-av/ffmpeg
          key: lgpl-ffmpeg-win64-${{ hashFiles('packaging/build_lgpl_av.py', '.github/workflows/release.yml') }}
      # GCC (UCRT, like MSVC) rather than MSVC: with only the needed parts
      # enabled, MSVC crashes on libavformat/cbs.c (C1001). FFmpeg's mingw build
      # also writes MSVC import libraries (.lib) for PyAV, which builds with MSVC.
      - name: Build LAME and LGPL-only FFmpeg with MinGW GCC
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          PREFIX="$ROOT/build/lgpl-av/ffmpeg"
          LAME="$ROOT/build/lgpl-av/lame"
          VERSION=$(uv run --no-project --python 3.11 python -c "import sys; sys.path.insert(0, 'packaging'); import build_lgpl_av as b; print(b.FFMPEG_VERSION, b.FFMPEG_SHA256, b.FFMPEG_URL, b.LAME_VERSION, b.LAME_SHA256, b.LAME_URL)")
          read -r FF_VERSION FF_SHA FF_URL LAME_VERSION LAME_SHA LAME_URL <<< "$VERSION"
          # GCC is a Windows program: give it LAME's folder as C:/... rather than /d/....
          FLAGS=$(uv run --no-project --python 3.11 python packaging/build_lgpl_av.py --print-configure-flags "$PREFIX" --lame-prefix "$(cygpath -m "$LAME")")
          mkdir -p build/lgpl-av && cd build/lgpl-av
          # LAME (LGPL) as a static library, linked into avcodec for MP3 saving.
          curl -fsSLo lame.tar.gz "$LAME_URL"
          echo "$LAME_SHA  lame.tar.gz" | sha256sum -c -
          tar xf lame.tar.gz
          (cd "lame-$LAME_VERSION" && ./configure --prefix="$LAME" --disable-shared \
              --enable-static --disable-frontend --disable-gtktest --disable-decoder \
            && make -j"$(nproc)" && make install)
          ls "$LAME/lib"
          curl -fsSLo ffmpeg.tar.xz "$FF_URL"
          echo "$FF_SHA  ffmpeg.tar.xz" | sha256sum -c -
          tar xf ffmpeg.tar.xz
          cd "ffmpeg-$FF_VERSION"
          # Link GCC's runtime (libgcc, winpthreads) into the DLLs: otherwise
          # delvewheel may bundle Git for Windows' msvcrt copies found on PATH,
          # and importing av fails with "The specified procedure could not be found".
          ./configure $FLAGS --extra-ldflags=-static
          make -j"$(nproc)"
          make install
          # The import libraries are installed next to the DLLs.
          cp -n "$PREFIX"/bin/*.lib "$PREFIX/lib/" || true
          ls "$PREFIX/bin" "$PREFIX/lib"
          # Each DLL may only need Windows' own DLLs and the other FFmpeg DLLs.
          for dll in "$PREFIX"/bin/*.dll; do
            echo "$(basename "$dll"): $(objdump -p "$dll" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')"
          done
      - name: Install
        run: uv sync --locked
      - name: LGPL PyAV wheel
        run: uv run python packaging/build_lgpl_av.py --ffmpeg-prefix build/lgpl-av/ffmpeg
      - name: Show the wheel's DLL dependencies (on failure)
        if: failure()
        shell: pwsh
        run: |
          $libs = "build\lgpl-av\test-venv\Lib\site-packages\av.libs"
          Get-ChildItem $libs
          Get-ChildItem $libs\*.dll, build\lgpl-av\test-venv\Lib\site-packages\av\_core*.pyd |
            ForEach-Object { dumpbin /nologo /dependents $_.FullName }
      - name: Bundle and check
        run: uv run python packaging/build_app.py
      - name: Installer
        shell: pwsh
        run: |
          $version = (uv run python -c "from importlib.metadata import version; print(version('notirua'))").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$pwd\dist\app\Notirua" `
            "/DOutputDir=$pwd\dist" `
            "/DIconFile=$pwd\build\icons-win32\notirua.ico" `
            packaging\windows\notirua.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: notirua-windows
          path: |
            dist/*.exe
            dist/lgpl-av/*.whl
