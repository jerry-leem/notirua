name: M0 spikes

# Cross-platform validation of SPEC 8 / M0 (S2-S6). Downloads ~300 MB of
# components per OS, so it only runs on demand.
on:
  workflow_dispatch:

jobs:
  spikes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      NOTIRUA_TEST_COMPONENTS_DIR: ${{ github.workspace }}/.components
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --locked --group build
      # Ubuntu runners ship no CJK fonts, like some user systems; use the fonts the
      # Linux build bundles so the E2E tests check that path (DECISIONS D8).
      - name: Bundled CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: uv run python packaging/fetch_fonts.py
      - name: Cache components
        uses: actions/cache@v4
        with:
          path: .components
          key: components-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/notirua/components/manifest.py') }}
      - name: Install components (S2, S3)
        run: uv run notirua setup --accept-licenses --dir .components
      - name: S3/S4 end-to-end tests
        run: uv run pytest -m slow -v --basetemp=pytest-tmp
      - name: Upload PDFs from failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pdfs-${{ matrix.os }}
          path: pytest-tmp/**/*.pdf
          if-no-files-found: ignore
      - name: S2 separation timing (60 s mix)
        # `setup --dir` stored .components in the user settings, so the spike finds it.
        run: uv run python spikes/s2_separate.py --seconds 60
      - name: S5/S6 bundle smoke test
        shell: bash
        run: |
          uv run pybabel compile -d locales -D notirua
          uv run pyinstaller --noconfirm --log-level WARN --distpath dist spikes/s5_bundle/s5.spec
          du -sh dist/notirua-spike || true
          if [ "$RUNNER_OS" = "Windows" ]; then ./dist/notirua-spike/notirua-spike.exe --smoke; else ./dist/notirua-spike/notirua-spike --smoke; fi
          if find dist -iname '*torch*' -o -iname '*tensorflow*' | grep -q .; then echo "torch/tensorflow found in bundle"; exit 1; fi

  # The real components on glibc 2.31 (Ubuntu 20.04): LilyPond's binary and
  # onnxruntime must run there too (DECISIONS D14).
  glibc-2-31:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      NOTIRUA_TEST_COMPONENTS_DIR: ${{ github.workspace }}/.components
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            libegl1 libgl1 libglib2.0-0 libatomic1 libxkbcommon0 libfontconfig1 \
            libfreetype6 libx11-6 libdbus-1-3 zlib1g libzstd1
          ldd --version | head -1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Bundled CJK fonts
        run: uv run python packaging/fetch_fonts.py
      - name: Install components
        run: uv run notirua setup --accept-licenses --dir .components
      - name: End-to-end tests
        run: uv run pytest -m slow -v
