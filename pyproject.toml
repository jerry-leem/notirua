[project]
name = "notirua"
version = "0.1.0.dev0"
description = "Convert audio into per-instrument scores, TAB, and PDFs."
readme = "README.md"
requires-python = "==3.11.*"
authors = [{ name = "Jerry An" }]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "av>=18,<19",
    "soxr>=0.5",
    "platformdirs>=4.2",
    "babel>=2.15",
    "music21>=10,<11",
    "PySide6-Essentials>=6.8",
]

[project.scripts]
notirua = "notirua.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pypdf>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "scipy-stubs; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notirua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs downloaded models or LilyPond; excluded from the fast suite",
    "gui: needs a Qt display",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/notirua/core/transcribe/_basic_pitch_vendor.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["notirua"]

[[tool.mypy.overrides]]
module = ["av.*", "soxr.*", "onnxruntime.*", "pypdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# music21 ships partial annotations; treat it as untyped (Any).
module = ["music21", "music21.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "notirua.core.arrange.tab.TabWeights",
    "notirua.core.quantize.QuantizeOptions",
]
